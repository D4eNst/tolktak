# TolkTak with HTTPS, PostgreSQL, S3 file storage and LiveKit. See docs/install/compose.md.
#   Put .env next to this file, then: docker compose up -d
# COMPOSE_PROFILES in .env picks the bundled services. Upgrades replace this file:
# keep your own changes in .env or compose.override.yaml.
name: tolktak

services:
  tolktak:
    image: d4enst/tolktak-server:${TOLKTAK_VERSION:-latest}
    restart: unless-stopped
    environment:
      TOLKTAK_SERVER_NAME: ${TOLKTAK_SERVER_NAME:-TolkTak}
      TOLKTAK_REGISTRATION: ${TOLKTAK_REGISTRATION:-invite}
      TOLKTAK_MAX_UPLOAD_MB: ${TOLKTAK_MAX_UPLOAD_MB:-50}
      TOLKTAK_USER_QUOTA_MB: ${TOLKTAK_USER_QUOTA_MB:-2048}
      TOLKTAK_CLIENT_DOWNLOAD_URL: ${TOLKTAK_CLIENT_DOWNLOAD_URL:-}
      TOLKTAK_TRUST_PROXY: ${TOLKTAK_TRUST_PROXY:-1}
      TOLKTAK_UPDATES: ${TOLKTAK_UPDATES:-manual}
      TOLKTAK_DATABASE_URL: ${TOLKTAK_DATABASE_URL:-postgres://tolktak:${POSTGRES_PASSWORD:-}@postgres:5432/tolktak}
      TOLKTAK_S3_BUCKET: ${TOLKTAK_S3_BUCKET-tolktak}
      TOLKTAK_S3_ENDPOINT: ${TOLKTAK_S3_ENDPOINT-http://garage:3900}
      TOLKTAK_S3_REGION: ${TOLKTAK_S3_REGION-garage}
      TOLKTAK_S3_ACCESS_KEY: ${TOLKTAK_S3_ACCESS_KEY:-${GARAGE_ACCESS_KEY:-}}
      TOLKTAK_S3_SECRET_KEY: ${TOLKTAK_S3_SECRET_KEY:-${GARAGE_SECRET_KEY:-}}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-tolktak}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?generate the secrets, see docs/install/compose.md}
      TOLKTAK_DEBUG: ${TOLKTAK_DEBUG:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - ${TOLKTAK_BIND:-127.0.0.1}:${TOLKTAK_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      garage:
        condition: service_started
        required: false

  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
        keys:
          ${LIVEKIT_API_KEY:-tolktak}: ${LIVEKIT_API_SECRET:?generate the secrets, see docs/install/compose.md}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-tolktak}
          urls: [http://tolktak:8080/api/v1/livekit/webhook]
        room:
          empty_timeout: 60
          # Adds H.264 42001f: Chromium encodes it on the GPU, the default 42e01f only in software.
          enabled_codecs:
            - mime: audio/opus
            - mime: audio/red
            - mime: audio/PCMU
            - mime: audio/PCMA
            - mime: video/H264
              fmtp_line: level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f
            - mime: video/H264
            - mime: video/VP8
            - mime: video/VP9
            - mime: video/AV1
            - mime: video/H265
            - mime: video/rtx
        turn:
          enabled: false
    ports:
      - ${LIVEKIT_BIND:-127.0.0.1}:${LIVEKIT_PORT:-7880}:7880
      - ${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}
      - ${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    profiles: [postgres]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tolktak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate the secrets, see docs/install/compose.md}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, tolktak]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    profiles: [garage]
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?generate the secrets, see docs/install/compose.md}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?generate the secrets, see docs/install/compose.md}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?generate the secrets, see docs/install/compose.md}
      GARAGE_DEFAULT_BUCKET: tolktak
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  caddy:
    profiles: [caddy]
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Installs new releases when the server asks for one (TOLKTAK_UPDATES in .env). It needs
  # the Docker socket: remove `updater` from COMPOSE_PROFILES to update by hand instead.
  updater:
    profiles: [updater]
    image: docker:28-cli
    restart: unless-stopped
    working_dir: /deploy
    entrypoint: [sh, /updater.sh]
    configs:
      - source: updater
        target: /updater.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy
      - data:/data

configs:
  caddy:
    content: |
      ${TOLKTAK_DOMAIN:?set TOLKTAK_DOMAIN in .env} {
        header Strict-Transport-Security max-age=31536000
        reverse_proxy /rtc* livekit:7880
        reverse_proxy tolktak:8080
      }
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
  # The server writes /data/updates/request ("pull 1.2.3" or "apply 1.2.3"); the updater answers
  # in status ("pulled 1.2.3" or "failed 1.2.3 <reason>") and touches agent while it runs.
  # $$ is how Compose writes a literal $.
  updater:
    content: |
      # /data/updates belongs to the server's user: never write through a link it may have planted.
      dir=/data/updates
      project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)" 2>/dev/null)
      [ -n "$$project" ] && export COMPOSE_PROJECT_NAME=$$project
      # The heartbeat runs on its own so a long pull does not look like a dead updater.
      (while true; do [ -d $$dir ] && rm -f $$dir/agent && (set -C; : > $$dir/agent); sleep 5; done) &
      while true; do
        sleep 5
        [ -f $$dir/request ] || continue
        read -r action version < $$dir/request
        rm -f $$dir/request
        echo "$$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$$' || continue
        case "$$action" in
          pull)
            if TOLKTAK_VERSION=$$version docker compose pull -q tolktak; then
              result="pulled $$version"
            else
              result="failed $$version pull failed"
            fi
            ;;
          apply)
            # Pin the version in .env, or the next manual `up -d` would start the old image on the migrated data.
            (
              umask 077
              if grep -q '^TOLKTAK_VERSION=' .env; then
                sed "s/^TOLKTAK_VERSION=.*/TOLKTAK_VERSION=$$version/" .env > .env.tmp
              else
                { cat .env; echo; echo "TOLKTAK_VERSION=$$version"; } > .env.tmp
              fi
            )
            cat .env.tmp > .env && rm .env.tmp
            docker compose up -d --no-deps tolktak && continue
            result="failed $$version compose failed"
            ;;
          *) continue ;;
        esac
        rm -f $$dir/status.tmp && (set -C; echo "$$result" > $$dir/status.tmp) && mv $$dir/status.tmp $$dir/status
      done

volumes:
  data:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
