# Host networking keeps UDP media simple. See docs/install/docker.md.
#   ./init.sh ...                # once: writes .env and livekit.yaml
#   docker compose up -d         # the published image (TOLKTAK_VERSION in .env)
#   docker compose up -d --build # or build from this checkout
services:
  tolktak:
    image: ghcr.io/d4enst/tolktak-server:${TOLKTAK_VERSION:-latest}
    build: ../server
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      TOLKTAK_LISTEN: ${TOLKTAK_BIND:-127.0.0.1}:${TOLKTAK_PORT:-8080}
      LIVEKIT_INTERNAL_URL: http://127.0.0.1:${LIVEKIT_PORT:-7880}
    volumes:
      - tolktak-data:/data

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  tolktak-data:
