[project]
name = "tolktak-server"
version = "0.1.0"
description = "TolkTak server: accounts, groups, chat and voice room signalling for a self-hosted TolkTak instance"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.159,<1",
    "uvicorn[standard]>=0.54,<1",
    "tortoise-orm[asyncpg]>=1.1.9,<2",
    "argon2-cffi>=25.1",
    "httpx>=0.28,<1",
    "orjson>=3.13",
]

[project.scripts]
tolktak-server = "tolktak.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.14",
    "ty>=0.0.91",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tolktak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.rules]
# Tortoise models declare their table in a nested `class Meta`. Tortoise also types
# values_list(..., flat=True) as tuples; those lines carry a `ty: ignore`.
invalid-attribute-override = "ignore"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC230", "ASYNC240"]  # small local file writes, done inline on purpose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
