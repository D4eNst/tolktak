name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing issues first.
        Do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join a voice room
        2. Share a window with audio
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Server
        - Deployment (Docker, reverse proxy, configuration)
        - Website (registration, invites)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the bottom of Settings → App.
      placeholder: 0.2.0
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Shown in the server log on start, or by `tolktak-server version`.
      placeholder: 0.2.0
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the version, for example Windows 11 24H2, macOS 15.3 (Apple Silicon), Ubuntu 24.04.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server or LiveKit logs (`docker compose logs tolktak livekit`), or the app's developer console output. Remove anything private.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, network setup (proxy, VPN), audio devices, or anything else that may help. For screen or audio capture problems on Windows, the output of client/e2e/windows/windows-probe.ps1 helps.
