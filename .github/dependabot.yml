version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version cannot open the existing data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directories: [/client, /website]
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
