version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new PostgreSQL major version cannot open the existing data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directories: [/client, /website]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node version inside Electron and move with Electron updates.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
