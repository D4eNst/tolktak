name: Windows preview

on:
  pull_request:
    paths: ['client/**', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Preview version
        default: 0.3.0-rc.1

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Set preview version
        run: npm version --no-git-tag-version --allow-same-version "$PREVIEW_VERSION"
        env:
          PREVIEW_VERSION: ${{ inputs.version || '0.3.0-rc.1' }}
      - run: npm run typecheck
      - run: npm run build
      - name: Build installer and portable archive
        run: npx electron-builder --win --x64 --publish never
      - name: Check packaged Windows bindings
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const koffi = require('./release/win-unpacked/resources/app.asar.unpacked/node_modules/koffi');
          const kernel = koffi.load('kernel32.dll');
          const processId = kernel.func('uint32 __stdcall GetCurrentProcessId()');
          assert.equal(processId(), process.pid);
          console.log('Packaged Windows bindings loaded successfully');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TolkTak-Windows-${{ github.event.pull_request.number || github.run_id }}
          path: |
            client/release/TolkTak-*.exe
            client/release/TolkTak-*.zip
          if-no-files-found: error
          retention-days: 14
