name: Perf

# Shared runners without a GPU: only large regressions are caught.
on:
  pull_request:
    paths: ['client/src/**', 'client/package*.json', 'client/e2e/stack.ts', 'perf/**', 'server/tolktak/livekit_process.py', 'deploy/compose.yaml', '.github/workflows/perf.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per scenario
        default: '2'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIVEKIT_VERSION: 1.13.10
      LIVEKIT_SHA256: c25a3e45fb922e9a93c6443d10c0ed041ba64342097e38632331736630283165
      PERF_CI_REPEATS: ${{ github.event.inputs.repeats || '2' }}
      PERF_HOST_NOTE: GitHub Actions ubuntu-24.04 runner (shared VM, no GPU)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: LiveKit server
        run: |
          mkdir -p "$RUNNER_TEMP/lk"
          curl -fsSL -o "$RUNNER_TEMP/lk.tar.gz" "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "$LIVEKIT_SHA256  $RUNNER_TEMP/lk.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/lk.tar.gz" -C "$RUNNER_TEMP/lk"
          echo "LIVEKIT_BIN=$RUNNER_TEMP/lk/livekit-server" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: uv sync --locked --no-dev
        working-directory: server
      - name: Perf scenarios and regression check
        run: perf/ci.sh "$RUNNER_TEMP/perf"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-linux
          path: ${{ runner.temp }}/perf
          retention-days: 30
